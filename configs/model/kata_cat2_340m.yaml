name: kata_cat2_340m
# Concat-SPD, M=2 groups, via parallel_kata_attn (flash SPD).
# A[t,s] = Sum_{i=1..2} (q_i . k_i)^2  (same-group squared dots, no cross terms).
hf_kwargs:
  model_type: kata
  hidden_size: 1024
  num_hidden_layers: 24
  num_heads: 16
  expand_k: 1.0
  expand_v: 1.0
  feature_map: kata_quadratic
  spd_num_groups: 2
  spd_use_kernel: false
  feature_map_eps: 1.0e-6
  norm_q: false
  norm_k: false
  use_short_conv: true
  conv_size: 4
  conv_bias: false
  use_rope: true          # RoPE on q,k before the SPD score (like self-attention)
  rope_theta: 10000.0
  attn_mode: chunk
  hidden_ratio: 4
  hidden_act: swish
  max_position_embeddings: 2048
  norm_eps: 1.0e-6
  tie_word_embeddings: true
  fuse_norm: true
  fuse_swiglu: true
  fuse_cross_entropy: true
  vocab_size: 32000
  bos_token_id: 1
  eos_token_id: 2
