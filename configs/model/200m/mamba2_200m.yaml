name: mamba2_200m
hf_kwargs:
  model_type: mamba2
  hidden_size: 768
  num_hidden_layers: 48      # 2x to match params (no per-block MLP)
  head_dim: 64
  state_size: 128
  expand: 2
  n_groups: 1
  conv_kernel: 4
  chunk_size: 256
  norm_eps: 1.0e-5
  rmsnorm: true
  residual_in_fp32: true
  tie_word_embeddings: true
  fuse_norm: true
  fuse_cross_entropy: true
  vocab_size: 32000
  bos_token_id: 1
  eos_token_id: 2
