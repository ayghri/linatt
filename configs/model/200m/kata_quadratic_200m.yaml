name: kata_quadratic_200m
# 200M KATA-quadratic. FlashAttention-style Triton kernel computes the
# concat-SPD attention pattern A[t,s] = Sum_i (q_i[t] . k_i[s])^2 inline
# from raw q, k — no psi tensor ever materialized in HBM. The math
# captures the same SPD recall capacity as concat-SPD without the
# qd=M*E^2 state-recurrence cost.
hf_kwargs:
  model_type: kata
  hidden_size: 768
  num_hidden_layers: 24
  num_heads: 12
  expand_k: 1.0
  expand_v: 1.0
  feature_map: kata_quadratic
  spd_num_groups: 4
  spd_use_kernel: false
  feature_map_eps: 1.0e-6
  norm_q: false
  norm_k: false
  use_short_conv: true
  conv_size: 4
  conv_bias: false
  attn_mode: chunk
  hidden_ratio: 4
  hidden_act: swish
  max_position_embeddings: 2048
  norm_eps: 1.0e-6
  tie_word_embeddings: true
  fuse_norm: true
  fuse_swiglu: true
  fuse_cross_entropy: true
  vocab_size: 32000
  bos_token_id: 1
  eos_token_id: 2
