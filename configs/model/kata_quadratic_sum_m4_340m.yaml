name: kata_quadratic_sum_m4_340m
# Sum-SPD M=4 quadratic. A[t,s] = Sum_{i,j}^{4,4} (q_i·k_j)^2 (M^2=16 cross-terms).
# State qd = E^2 = (d_h/4)^2 = 256 at d_h=64. Smallest state, most compute.
hf_kwargs:
  model_type: kata
  hidden_size: 1024
  num_hidden_layers: 24
  num_heads: 16
  expand_k: 1.0
  expand_v: 1.0
  feature_map: kata_quadratic_sum
  spd_num_groups: 4
  spd_use_kernel: false
  feature_map_eps: 1.0e-6
  norm_q: false
  norm_k: false
  use_short_conv: true
  conv_size: 4
  conv_bias: false
  attn_mode: chunk
  hidden_ratio: 4
  hidden_act: swish
  max_position_embeddings: 2048
  norm_eps: 1.0e-6
  tie_word_embeddings: true
  fuse_norm: true
  fuse_swiglu: true
  fuse_cross_entropy: true
  vocab_size: 32000
  bos_token_id: 1
  eos_token_id: 2
