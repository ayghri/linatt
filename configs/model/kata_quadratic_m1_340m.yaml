name: kata_quadratic_m1_340m
# Same as kata_quadratic_340m but with M=1 (no SPD group split).
# Implicit psi(q) = vec(q q^T) of dim d_head^2 = 4096 at d_head=64,
# never materialized — the kernel computes A[t,s] = (q[t] . k[s])^2
# inline as a single dot product per (t,s) block.
# MQAR sweep showed M=1 reaches 1.000 at K=1024 (beats paper).
hf_kwargs:
  model_type: kata
  hidden_size: 1024
  num_hidden_layers: 24
  num_heads: 16
  expand_k: 1.0
  expand_v: 1.0
  feature_map: kata_quadratic
  spd_num_groups: 1
  spd_use_kernel: false
  feature_map_eps: 1.0e-6
  norm_q: false
  norm_k: false
  use_short_conv: true
  conv_size: 4
  conv_bias: false
  attn_mode: chunk
  hidden_ratio: 4
  hidden_act: swish
  max_position_embeddings: 2048
  norm_eps: 1.0e-6
  tie_word_embeddings: true
  fuse_norm: true
  fuse_swiglu: true
  fuse_cross_entropy: true
  vocab_size: 32000
  bos_token_id: 1
  eos_token_id: 2
