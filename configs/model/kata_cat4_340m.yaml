name: kata_cat4_340m
# transformer_340m to the T, EXCEPT:
#   (1) interleaved RoPE (interleaved=True, set in KataAttention)
#   (2) kata concat-SPD M=4 attention instead of full softmax attention
# Mapping of transformer-only field names onto the kata layer (same behavior):
##   qkv_bias: false -> kata projections are always bias-free (matches)
#   window_size: null -> kata is full attention (matches)
hf_kwargs:
  model_type: kata
  hidden_size: 1024
  num_hidden_layers: 24
  num_heads: 16
  num_kv_heads: 16
  expand_k: 1.0
  expand_v: 1.0
  feature_map: kata_quadratic     # concat-SPD score  Sum_i (q_i . k_i)^2
  spd_num_groups: 4               # cat4  (E=16 per group)
  spd_use_kernel: false           # routes to parallel_kata_attn flash kernel
  qk_norm: true                   # master switch for qk normalization
  norm_q: rmsnorm                   # norm TYPE for q: rmsnorm | l2
  norm_k: rmsnorm                   # norm TYPE for k
  use_short_conv: false           # transformer has NO short conv
  use_rope: true                  # interleaved=True inside KataAttention
  rope_theta: 10000.0     # 2x full attention's 10000: doubles the period to undo the
  rope_group: false       # full-head interleaved RoPE (per-group was a net negative)
  max_position_embeddings: 2048
  hidden_ratio: 4
  hidden_act: swish
  norm_eps: 1.0e-6
  tie_word_embeddings: true
  fuse_norm: true
  fuse_swiglu: true
  fuse_cross_entropy: true
  vocab_size: 32000
  bos_token_id: 1
  eos_token_id: 2
