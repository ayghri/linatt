name: kataconv_cat_l2_gdn_340m
# "GDN-imitating" kata: SPD recall + offset (suppression/sign) + data-dependent
# decay (recency/replacement). conv + L2 qk-norm, no RoPE. Recall+suppress+replace.
hf_kwargs:
  model_type: kata
  hidden_size: 1024
  num_hidden_layers: 24
  num_heads: 16
  expand_k: 1.0
  expand_v: 1.0
  feature_map: kata_quadratic
  spd_num_groups: 2
  spd_use_kernel: false
  feature_map_eps: 1.0e-6
  qk_norm: true
  norm_q: l2
  norm_k: l2
  use_offset_gate: true            # data-dependent affine offset -> sign/suppression
  use_decay: true                  # GDN-style cumulative decay -> recency/replacement
  use_short_conv: true
  conv_size: 4
  conv_bias: false
  attn_mode: chunk
  hidden_ratio: 4
  hidden_act: swish
  max_position_embeddings: 2048
  norm_eps: 1.0e-6
  tie_word_embeddings: true
  fuse_norm: true
  fuse_swiglu: true
  fuse_cross_entropy: true
  vocab_size: 32000
  bos_token_id: 1
  eos_token_id: 2
