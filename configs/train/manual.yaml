# Recipe for the manual DDP trainer (train_llm.py). Paper 340M setting:
# AdamW, peak lr 3e-4, init/final lr 3e-5, cosine, warmup 0.5B tokens,
# weight decay 0.01, grad clip 1.0, batch 0.5M tokens, 15B tokens total.
# batch_size/GPU is COMPUTED: tokens_per_step / world_size / grad_accum / seq_len.
tokens_per_step: 524288        # 0.5M tokens / optimizer step
grad_accum: 4                  # 8 GPU x 4 accum -> batch_size/GPU = 524288/8/4/2048 = 8
warmup_tokens: 500_000_000     # 0.5B tokens
lr: 3.0e-4                     # peak learning rate
min_lr_rate: 0.1               # min_lr = min_lr_rate * lr = 3e-5 (paper init/final lr)
betas: [0.9, 0.95]
weight_decay: 0.01
max_grad_norm: 1.0
backend: nccl                  # gloo for same-GPU multi-rank smoke tests
resume: null                   # null | "latest" | path/to/step_N.pt

progress_interval: 50          # log to wandb every N optimizer steps
# checkpointing cadence = checkpoint_rate (main.yaml) * max_steps
