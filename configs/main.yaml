# Top-level config. Compose model + data + train.
# Override on cli, e.g.:
#   python train.py model=mamba2_200m
#   python train.py model=delta_net_200m train.lr=4e-4
defaults:
  - model: transformer_340m
  - data: slimpajama_15bt
  - train: manual
  - _self_

run_name: ${model.name}_${data.name}
output_dir: runs/${run_name}
checkpoint_rate: 0.05
seed: 42

wandb:
  project: kata
  entity: ayghri-cu
  mode: online # online | offline | disabled

eval:
  # Run lm-eval-harness inline at these fractions of total training steps.
  fractions: [0.20, 0.40, 0.60, 0.80, 1.00]
  tasks:
    # acc tasks
    - piqa
    - hellaswag
    - winogrande
    - arc_easy
    - arc_challenge
    - boolq
    # acc + perplexity
    - lambada_openai
    # word_perplexity / byte_perplexity / bits_per_byte
    - wikitext
    # NOTE: social_iqa removed — its HF dataset uses a script loader
    # (social_i_qa.py) which datasets>=4 no longer supports.
  batch_size: 16

hydra:
  run:
    dir: ${output_dir}/hydra
  job:
    chdir: false
