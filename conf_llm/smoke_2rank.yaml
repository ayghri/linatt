# Tiny GDN + dummy data for a 2-rank-same-GPU DDP smoke test of run_llm.py.
# 512 blocks, bs8, 2 ranks, drop_last -> ~32 microbatches/rank ; grad_accum 2.
# tokens_per_step = 8 * 2 * 2 * 128 = 4096 ; total_tokens 81920 -> max_steps 20.

model:
  hf_kwargs:
    model_type: gated_deltanet
    hidden_size: 128
    num_hidden_layers: 2
    num_heads: 2
    head_dim: 64
    expand_v: 1.0
    use_gate: true
    use_short_conv: true
    conv_size: 4
    attn_mode: chunk
    hidden_ratio: 4
    hidden_act: swish
    max_position_embeddings: 128
    norm_eps: 1.0e-6
    tie_word_embeddings: true
    fuse_norm: true
    fuse_swiglu: true
    fuse_cross_entropy: false
    fuse_linear_cross_entropy: true
    vocab_size: 256
    bos_token_id: 1
    eos_token_id: 2

data:
  cache_path: data/dummy/train

train:
  backend: gloo           # same-GPU multi-rank needs gloo (nccl forbids GPU sharing)
  batch_size: 8
  seq_len: 128
  grad_accum: 2
  total_tokens: 40960
  progress_interval: 5
  save_interval: 10
  save_dir: runs/smoke_2rank

  optimizer:
    lr: 1.0e-3
    betas: [0.9, 0.95]
    weight_decay: 0.1

  schedule:
    warmup_steps: 2
    peak_lr: 1.0e-3
    min_lr: 1.0e-4
