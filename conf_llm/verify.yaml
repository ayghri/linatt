# Smoke-test config for the manual DDP trainer (train_llm.DDPLLMPretrainer).
# tokens_per_step = batch_size * world_size * grad_accum * seq_len = 16*1*2*16 = 512
# dataset 256 samples, drop_last, bs16 -> 16 microbatches -> 8 optim steps max.
# total_tokens 4096 -> max_steps = 4096 // 512 = 8  (== 16 // grad_accum).
batch_size: 16
seq_len: 16
grad_accum: 2
total_tokens: 4096
progress_interval: 1
save_interval: 4
save_dir: /tmp/verify_llm_ckpt

optimizer:
  lr: 1.0e-4
  betas: [0.9, 0.95]
  weight_decay: 0.1

schedule:
  warmup_steps: 1
  peak_lr: 1.0e-4
  min_lr: 1.0e-5
